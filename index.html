<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Boğaziçi University Program Tracker</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23003366'/><path d='M50 24 L82 40 L50 56 L18 40 Z' fill='%23ffffff'/><path d='M30 46 L30 64 C30 73 70 73 70 64 L70 46' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/><path d='M76 43 L76 65 C76 68 80 68 80 65 L80 43' fill='none' stroke='%23f59e0b' stroke-width='3'/><circle cx='80' cy='67' r='3' fill='%23f59e0b'/></svg>" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="top-bar">
    <h1>
      <span>🎓 Boğaziçi Tracker</span>
      <span id="appSubtitle" style="font-weight: 400; font-size: 1.05rem; color: #64748b;">| Ders & GPA Takip</span>
    </h1>
    
    <div class="top-bar-controls">
      <div class="dept-select-container">
        <label id="deptLabel" for="deptSelect">Bölüm:</label>
        <select id="deptSelect" class="dept-select" onchange="changeDepartment(this.value)">
        </select>
      </div>
      <div class="minor-select-container">
        <button id="minorBtn" class="minor-btn" onclick="openMinorModal()" title="Yandal Programı Seç / Düzenle">
          🎓 Yandal Ekle
        </button>
      </div>
      <div class="top-bar-btn-group">
        <button id="exportBtn" class="topbar-btn export-btn" onclick="exportDataAsJSON()" title="Mevcut ders planınızı ve notlarınızı JSON dosyası olarak indirin">
          📥 JSON İndir
        </button>
        <button id="importBtn" class="topbar-btn import-btn" onclick="document.getElementById('jsonFileInput').click()" title="Daha önce indirdiğiniz JSON planını yükleyin">
          📤 JSON Yükle
        </button>
        <button id="feedbackBtn" class="topbar-btn feedback-btn" onclick="openFeedbackModal()" title="Hata Bildir veya Öneri Paylaş">
          💬 Hata / Öneri
        </button>
        <button id="langToggleBtn" class="topbar-btn lang-btn" onclick="toggleLanguage()" title="Dil Değiştir / Switch Language">
          🌐 <span id="langToggleLabel">TR | EN</span>
        </button>
        <button id="resetBtn" class="reset-btn" onclick="resetCurrentDept()" title="Bölüm planını sıfırla">Sıfırla</button>
      </div>
      <input type="file" id="jsonFileInput" accept=".json,application/json" style="display: none;" onchange="importDataFromJSON(event)">
    </div>
  </header>

  <nav class="mobile-tab-bar" id="mobileTabs">
    <button class="tab-btn active" id="tabBtnPool" onclick="switchMobileTab('pool')">
      📋 Ders Havuzu
    </button>
    <button class="tab-btn" id="tabBtnSemesters" onclick="switchMobileTab('semesters')">
      📅 Dönemler & Plan
    </button>
  </nav>

  <main class="app-main">
    <aside class="sidebar active-tab" id="sidebarContainer">
      <div class="sidebar-fixed-top" id="sidebarFixedTop">
        <div id="dashCardWrapper" class="dashboard-card-wrapper">
          <div class="dashboard-card">
            <div class="dash-row">
              <div class="dash-item">
                <span class="dash-label">GPA</span>
                <span id="gpa-display" class="dash-val">0.00</span>
              </div>
              <div class="dash-item" style="text-align: right;">
                <span id="labelRemainingTotal" class="dash-label">Kalan / Toplam</span>
                <span id="remaining-count" class="dash-val">0</span>
              </div>
            </div>
            
            <div class="dash-row" style="border-top: 1px solid rgba(255,255,255,0.18); padding-top: 5px;">
              <div class="dash-item">
                <span id="labelSelectedCourses" class="dash-label">Seçilen Ders</span>
                <span id="selected-courses-count" class="dash-subval">0 Ders</span>
              </div>
              <div class="dash-item" style="text-align: right;">
                <span id="labelSelectedCredits" class="dash-label">Seçilen Kredi</span>
                <span id="selected-credits" class="dash-subval">0 Cr</span>
              </div>
            </div>

            <div class="dash-row" style="border-top: 1px solid rgba(255,255,255,0.18); padding-top: 5px;">
              <div class="dash-item">
                <span id="labelCompleted" class="dash-label">Tamamlanan</span>
                <span id="completed-credits" class="dash-subval">0 Cr (0 Ders)</span>
              </div>
              <div class="dash-item" style="text-align: right;">
                <span id="labelTargetCredits" class="dash-label">Hedef Kredi</span>
                <span id="total-credits" class="dash-subval">0 Cr</span>
              </div>
            </div>
          </div>
        </div>

        <div class="sidebar-title">
          <span id="sidebarPoolTitle">Ders Havuzu</span>
          <span id="sidebarPoolSubtitle" style="font-size: 0.74rem; font-weight: normal; color: var(--text-muted);">Dönem Blokları</span>
        </div>
      </div>

      <div id="course-pool" class="sidebar-scroll-pool"></div>
    </aside>

    <section class="main-content" id="years-grid"></section>
  </main>

  <div id="global-tooltip"></div>
  <div id="toast" class="toast-msg"></div>

  <!-- Hata Bildir / Öneri Paylaş Modalı -->
  <div id="feedbackModal" class="modal-backdrop" onclick="handleFeedbackBackdropClick(event)">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="feedbackModalTitle">
      <div class="modal-header">
        <h3 id="feedbackModalTitle">💬 Hata / Öneri Bildir</h3>
        <button type="button" class="modal-close-btn" onclick="closeFeedbackModal()" aria-label="Kapat">✕</button>
      </div>
      <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
        <div class="modal-body">
          <div class="form-group">
            <label for="feedbackTitle"><span id="feedbackTitleLabel">Başlık</span> <span style="color:#ef4444;">*</span></label>
            <input type="text" id="feedbackTitle" class="form-control" placeholder="Örn: CMPE 250 önkoşulu hatalı" required maxlength="120">
          </div>

          <div class="form-group">
            <label id="feedbackCategoryLabel" for="feedbackCategory">Kategori</label>
            <select id="feedbackCategory" class="form-control" style="cursor: pointer;">
              <option value="Hatalı Ders/Önkoşul">Hatalı Ders/Önkoşul</option>
              <option value="Yeni Özellik Önerisi">Yeni Özellik Önerisi</option>
              <option value="Arayüz/Hesaplama Hatası">Arayüz/Hesaplama Hatası</option>
              <option value="Diğer">Diğer</option>
            </select>
          </div>

          <div class="form-group">
            <label for="feedbackDesc"><span id="feedbackDescLabel">Açıklama</span> <span style="color:#ef4444;">*</span></label>
            <textarea id="feedbackDesc" class="form-control" placeholder="Detaylı açıklama..." rows="4" required></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="feedbackCancelBtn" class="btn-cancel-issue" onclick="closeFeedbackModal()">İptal</button>
          <button type="submit" id="feedbackSubmitBtn" class="btn-submit-issue">
            <span>Gönder</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Yandal Programı Seçim Modalı -->
  <div id="minorModal" class="modal-backdrop" onclick="handleMinorBackdropClick(event)">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="minorModalTitle">
      <div class="modal-header">
        <h3 id="minorModalTitle">🎓 Yandal Programı Seçimi</h3>
        <button type="button" class="modal-close-btn" onclick="closeMinorModal()" aria-label="Kapat">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label id="minorSelectLabel" for="minorSelect">Yandal Programı Seçin</label>
          <select id="minorSelect" class="form-control" onchange="handleMinorSelectChange(this.value)" style="cursor: pointer;">
            <option value="">(Yandal Yok / İptal Et)</option>
          </select>
        </div>

        <div id="minorPreviewBox" class="minor-preview-box">
          <div style="color: #64748b; font-style: italic;">Lütfen incelemek istediğiniz bir yandal programı seçin.</div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="minorCancelBtn" class="btn-cancel-issue" onclick="closeMinorModal()">Vazgeç</button>
        <button type="button" id="minorApplyBtn" class="btn-submit-issue" onclick="handleApplyMinorFromModal()">
          <span>Yandalı Uygula</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
